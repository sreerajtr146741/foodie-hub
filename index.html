<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie-Hub</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    />
  </head>
  <body>
    <!---- HEADER---->

    <header class="header">
      <h1 class="header_title">Foodie<span>Hub</span></h1>
      <ul class="header_menus">
        <li><a href="#home"> home</a></li>
        <li><a href="#menu">Menus</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#service">Service</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </header>

    <!---SECTION:HOME--->
    <section id="home" class="section-home section-menu">
      <div class="section-home-content">
        <h1 class="section-home-title">
          Where <span> Every Bite</span> Tells a Story
        </h1>
        <div class="section-home-button">
          <button class="contact-button">Contact</button>
          <button class="explore-button">Explore</button>
        </div>
      </div>
      <img class="section-home-image" src="images/burger.png" alt="burger" />
    </section>

    <section class="section-menu" id="menu">
      <h1 class="section-title">Our <span>Menus</span></h1>
      <article class="section-desk">
        Good food makes good moments! <br />
        Our variety of dishes—from spicy snacks to creamy desserts—<br />
        will surely bring a smile with every bite.
      </article>

      <!-- Menu Row (two items side by side) -->
      <div class="menu-row">
        <!-- Item 1 -->
        <div class="menu-card">
          <img
            class="menu-image"
            src="images/friedchicken.png"
            alt="Fried Chicken"
          />
          <h3 class="menu-title">Fried Chicken</h3>
          <div class="menu-rating">⭐⭐⭐⭐⭐ <span>5.0</span></div>
          <h2 class="menu-price">$4.90</h2>
          <button class="primary-button">BUY</button>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="menu-card">
        <img class="menu-image" src="images/piza.png" alt="Pizza" />
        <h3 class="menu-title">Pizza</h3>
        <div class="menu-rating">⭐⭐⭐⭐⭐ <span>5.0</span></div>
        <h2 class="menu-price">$6.50</h2>
        <button class="primary-button">BUY</button>
      </div>
    </section>

    <!---  SECTION: ABOUT-->
    <section id="about" class="section-about section -menu"></section>
    <!---   END SECTION: ABOUT-->
    <!----SECTION SERVICE--->
    <section id="service" class="section-service"></section>
    <!---  SECTION: END SERVICE-->
    <section id="contact" class="section-contact section -menu"></section>
    <!---  SECTION: END CONTACT-->

    <!-----FOOTER---->
    <footer class="footer"></footer>
    <!---END FOOTER-->
  </body>
</html>
